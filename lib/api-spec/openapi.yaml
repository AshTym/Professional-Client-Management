      tags: [engagements]
      summary: Send a reviewed engagement letter through the firm's DocuSign connection
      responses:
        "200":
          description: Signature request sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementLetter"
        "409":
          description: Letter is not a draft or DocuSign is not connected
  /engagement-letters/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: syncEngagementLetter
      tags: [engagements]
      summary: Check DocuSign status and store a completed signed document
      responses:
        "200":
          description: Updated signature status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngagementLetter"
  /trust/overview:
    get:
      operationId: getTrustOverview
      tags: [trust]
      summary: Get firm trust accounts, ledger entries, and reconciliation exceptions
      responses:
        "200":
          description: Trust recordkeeping overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustOverview"
  /trust/statement:
    get:
      operationId: getTrustAccountStatement
      tags: [trust]
      summary: Get a matter-specific trust ledger statement
      parameters:
        - name: accountId
          in: query
          required: true
          schema: { type: integer }
        - name: matterId
          in: query
          required: true
          schema: { type: integer }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Matter trust ledger statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustAccountStatement"
        "400":
          description: Invalid statement period
        "401":
          description: Sign in required
        "403":
          description: Firm access required
        "404":
          description: Account or matter not found
        "500":
          description: Server error
  /trust/accounts:
    post:
      operationId: createTrustAccount
      tags: [trust]
      summary: Create a firm trust or client-money recordkeeping account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustAccountInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustAccount"
  /trust/entries:
    post:
      operationId: createTrustEntry
      tags: [trust]
      summary: Record a proposed client-money deposit or disbursement; this does not move funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustEntryInput"
      responses:
        "201":
          description: Entry awaiting approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustEntry"
  /trust/entries/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: decideTrustEntry
      tags: [trust]
      summary: Approve or reject a pending client-money ledger entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustEntryDecisionInput"
      responses:
        "200":
          description: Entry decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustEntry"
        "409":
          description: Entry is not awaiting approval
  /trust/statements:
    post:
      operationId: importTrustStatement
      tags: [trust]
      summary: Import a manual or CSV statement for reconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustStatementInput"
      responses:
        "201":
          description: Statement and lines imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustStatement"
  /trust/statements/{statementId}/lines/{lineId}:
    parameters:
      - name: statementId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: lineId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: matchTrustStatementLine
      tags: [trust]
      summary: Match a statement line to an approved ledger entry or clear its match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrustStatementMatchInput"
      responses:
        "200":
          description: Statement line updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustStatement"
  /matters/{id}/closeout:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getMatterCloseout
      tags: [closeout]
      summary: Get persisted closeout steps, retention context, and re-engagement reminders
      responses:
        "200":
          description: Closeout workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterCloseout"
    post:
      operationId: initializeMatterCloseout
      tags: [closeout]
      summary: Create default final-billing, handover, and retention review steps
      responses:
        "200":
          description: Initialized closeout workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterCloseout"
  /closeout-items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateCloseoutItem
      tags: [closeout]
      summary: Mark a closeout step complete or reopen it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseoutItemUpdateInput"
      responses:
        "200":
          description: Updated closeout step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloseoutItem"
  /matters/{id}/followups:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: createMatterFollowup
      tags: [closeout]
      summary: Schedule a renewal or re-engagement reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterFollowupInput"
      responses:
        "201":
          description: Follow-up scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterFollowup"
  /matter-followups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateMatterFollowup
      tags: [closeout]
      summary: Complete or reopen a re-engagement reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterFollowupUpdateInput"
      responses:
        "200":
          description: Updated follow-up reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatterFollowup"
  /reports/operations:
    get:
      operationId: getOperationsReport
      tags: [reports]
      summary: Get workload, deadline, aging work-in-progress, and matter pipeline metrics
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Firm operations report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsReport"
        "403":
          description: Firm administrator access required
  /reports/operations/export:
    post:
      operationId: logOperationsReportExport
      tags: [reports]
      summary: Record a firm operations report export in the audit trail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationsReportExportInput"
      responses:
        "200":
          description: Export action recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationsReportExportResult"
        "400":
          description: Invalid export metadata
        "403":
          description: Firm administrator access required
  /reports/operations/capacity:
    put:
      operationId: saveTeamCapacity
      tags: [reports]
      summary: Set weekly hours and active-matter limits for firm members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCapacityInput"
      responses:
        "200":
          description: Capacity settings saved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamCapacity"
        "403":
          description: Firm administrator access required

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ContactInquiryInput:
      type: object
      required: [name, email, message]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        organization: { type: string, maxLength: 160 }
        message: { type: string, minLength: 1, maxLength: 4000 }
        website:
          type: string
          maxLength: 255
          description: Hidden anti-spam field; leave blank.
    Workspace:
      type: object
      required: [id, name, practiceType, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        practiceType:
          type: string
          enum: [law, financial, both]
        createdAt: { type: string, format: date-time }
    WorkspaceContext:
      type: object
      required: [userId, email, name, workspace, role]
      properties:
        userId: { type: string }
        email: { type: string }
        name: { type: string }
        workspace:
          anyOf:
            - $ref: "#/components/schemas/Workspace"
            - type: "null"
        role:
          type: ["string", "null"]
          enum: [owner, admin, advisor, professional, assistant, null]
    WorkspaceInput:
      type: object
      required: [name, practiceType]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        practiceType:
          type: string
          enum: [law, financial, both]
    WorkspaceInvitation:
      type: object
      required: [id, email, role, createdAt, expiresAt, expired, revoked, providerRevocationFailed]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role:
          type: string
          enum: [admin, advisor, professional, assistant]
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        expired: { type: boolean }
        revoked: { type: boolean }
        providerRevocationFailed: { type: boolean }
    WorkspaceMember:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }
    OwnershipNoticeFailure:
      type: object
      required: [transferId, recipientRole, recipientName, otherOwnerName, status, recordedAt]
      properties:
        transferId: { type: string }
        recipientRole:
          type: string
          enum: [former_owner, new_owner]
        recipientName: { type: string }
        otherOwnerName: { type: string }
        status:
          type: string
          enum: [failed, pending]
        recordedAt: { type: string, format: date-time }
    OwnershipNoticeRetryResult:
      type: object
      required: [sent]
      properties:
        sent: { type: boolean, enum: [true] }
    WorkspaceAssignmentMember:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
    WorkspaceAssignmentIssues:
      type: object
      required: [clients, matters]
      properties:
        clients:
          type: array
          items:
            type: object
            required: [id, name, label]
            properties:
              id: { type: integer }
              name: { type: string }
              label: { type: string }
        matters:
          type: array
          items:
            type: object
            required: [id, title, reference, clientName, label]
            properties:
              id: { type: integer }
              title: { type: string }
              reference: { type: string }
              clientName: { type: string }
              label: { type: string }
    WorkspaceAssignmentResolutionInput:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: integer
          minimum: 1
    WorkspaceAssignmentResolution:
      type: object
      required: [entityType, id, memberId, label]
      properties:
        entityType:
          type: string
          enum: [client, matter]
        id: { type: integer }
        memberId: { type: integer }
        label: { type: string }
    WorkspaceMembershipConflict:
      type: object
      required:
        - membershipId
        - memberName
        - email
        - role
        - firmName
        - otherFirmCount
        - otherMembershipCount
        - lastDecision
        - lastDecisionBy
        - lastDecisionAt
        - lastDecisionReason
      properties:
        membershipId: { type: integer }
        memberName: { type: string }
        email: { type: string }
        role: { type: string }
        firmName: { type: string }
        otherFirmCount: { type: integer }
        otherMembershipCount: { type: integer }
        lastDecision:
          type: ["string", "null"]
          enum: [retain, remove, null]
        lastDecisionBy: { type: ["string", "null"] }
        lastDecisionAt: { type: ["string", "null"], format: date-time }
        lastDecisionReason: { type: ["string", "null"] }
    WorkspaceMembershipConflictDecisionInput:
      type: object
      required: [decision, reason]
      properties:
        decision:
          type: string
          enum: [retain, remove]
        reason:
          type: string
          minLength: 3
          maxLength: 500
        replacementMemberId:
          type: integer
          minimum: 1
    WorkspaceMembershipConflictDecision:
      type: object
      required: [membershipId, decision, accessRemoved, remainingMembershipCount, decidedAt]
      properties:
        membershipId: { type: integer }
        decision:
          type: string
          enum: [retain, remove]
        accessRemoved: { type: boolean }
        remainingMembershipCount: { type: integer }
        decidedAt: { type: string, format: date-time }
    WorkspaceMemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, advisor, professional, assistant]
    WorkspaceMemberRemoval:
      type: object
      properties:
        replacementMemberId: { type: integer, minimum: 1 }
    WorkspaceMemberAssignments:
      type: object
      required: [clients, matters, intakes, unresolvedClients, unresolvedMatters]
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMemberAssignedClient"
        matters:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMemberAssignedMatter"
        intakes:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMemberAssignedIntake"
        unresolvedClients:
          type: array
          items:
            type: object
            required: [id, name, label]
            properties:
              id: { type: integer }
              name: { type: string }
              label: { type: string }
        unresolvedMatters:
          type: array
          items:
            type: object
            required: [id, title, reference, clientName, label]
            properties:
              id: { type: integer }
              title: { type: string }
              reference: { type: string }
              clientName: { type: string }
              label: { type: string }
    WorkspaceMemberAssignedClient:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    WorkspaceMemberAssignedMatter:
      type: object
      required: [id, title, reference, clientName]
      properties:
        id: { type: integer }
        title: { type: string }
        reference: { type: string }
        clientName: { type: string }
    WorkspaceMemberAssignedIntake:
      type: object
      required: [id, clientName, matterTitle, status]
      properties:
        id: { type: integer }
        clientName: { type: string }
        matterTitle: { type: string }
        status:
          type: string
          enum: [review_required, cleared]
    WorkspaceInvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role:
          type: string
          enum: [admin, advisor, professional, assistant]
    WorkspaceInvitationAcceptance:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
    Client:
      type: object
      required: [id, name, clientType, email, phone, industry, status, owner, ownerMemberId, matterCount, lastActivityAt, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        clientType:
          type: string
          enum: [individual, business]
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        status:
          type: string
          enum: [prospect, active, archived]
        owner: { type: string }
        ownerMemberId: { type: ["integer", "null"] }
        matterCount: { type: integer }
        lastActivityAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    ClientInput:
      type: object
      required: [name, clientType]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        clientType:
          type: string
          enum: [individual, business]
        email: { type: ["string", "null"], format: email }
        phone: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        status:
          type: string
          enum: [prospect, active, archived]
        ownerMemberId: { type: integer, minimum: 1 }
    ClientUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        clientType:
          type: string
          enum: [individual, business]
        email: { type: ["string", "null"], format: email }
        phone: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        status:
          type: string
          enum: [prospect, active, archived]
        ownerMemberId: { type: integer, minimum: 1 }
    Matter:
      type: object
      required: [id, clientId, clientName, title, reference, matterType, status, riskLevel, responsible, responsibleMemberId, dueAt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        clientName: { type: string }
        title: { type: string }
        reference: { type: string }
        matterType: { type: string }
        status:
          type: string
          enum: [open, on_hold, closed]
        riskLevel:
          type: string
          enum: [low, medium, high]
        responsible: { type: string }
        responsibleMemberId: { type: ["integer", "null"] }
        dueAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    MatterInput:
      type: object
      required: [clientId, title, matterType, responsibleMemberId]
      properties:
        clientId: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        matterType: { type: string, minLength: 1, maxLength: 120 }
        status:
          type: string
          enum: [open, on_hold, closed]
        riskLevel:
          type: string
          enum: [low, medium, high]
        responsible: { type: string, minLength: 1, maxLength: 160 }
        responsibleMemberId: { type: integer, minimum: 1 }
        dueAt: { type: ["string", "null"], format: date-time }
    MatterUpdate:
      type: object
      minProperties: 1
      properties:
        clientId: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 200 }
        matterType: { type: string, minLength: 1, maxLength: 120 }
        status:
          type: string
          enum: [open, on_hold, closed]
        riskLevel:
          type: string
          enum: [low, medium, high]
        responsible: { type: string, minLength: 1, maxLength: 160 }
        responsibleMemberId: { type: integer, minimum: 1 }
        dueAt: { type: ["string", "null"], format: date-time }
    Activity:
      type: object
      required: [id, actor, action, entityType, entityId, entityLabel, occurredAt]
      properties:
        id: { type: integer }
        actor: { type: string }
        action: { type: string }
        entityType:
          type: string
          enum: [client, matter, workspace]
        entityId: { type: integer }
        entityLabel: { type: string }
        occurredAt: { type: string, format: date-time }
    ActivityActor:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          minLength: 67
          maxLength: 67
          pattern: "^v1_[a-f0-9]{64}$"
          description: Opaque identifier scoped to the current firm; never an identity-provider ID.
        name: { type: string }
    ActivityActorsResponse:
      type: array
      items:
        $ref: "#/components/schemas/ActivityActor"
    ActivityPage:
      type: object
      required: [items, snapshotId, latestSnapshotId]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        snapshotId: { type: integer, minimum: 0 }
        latestSnapshotId:
          type: integer
          minimum: 0
          description: Highest activity ID currently available in this firm.
    DashboardSummary:
      type: object
      required: [clientCount, activeClientCount, matterCount, openMatterCount, overdueMatterCount, recentActivity]
      properties:
        clientCount: { type: integer }
        activeClientCount: { type: integer }
        matterCount: { type: integer }
        openMatterCount: { type: integer }
        overdueMatterCount: { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
    BillingOverview:
      type: object
      required: [profiles, timeEntries, drafts]
      properties:
        profiles:
          type: array
          items: { $ref: "#/components/schemas/BillingProfile" }
        timeEntries:
          type: array
          items: { $ref: "#/components/schemas/TimeEntry" }
        drafts:
          type: array
          items: { $ref: "#/components/schemas/BillingDraft" }
    BillingProfile:
      type: object
      required: [id, matterId, matterTitle, clientName, feeType, currency, hourlyRateCents, fixedFeeCents, feeDescription, billingCycle, taxRateBps, scheduleEnabled, periodStartAt, nextDraftAt, updatedAt]
      properties:
        id: { type: integer }
        matterId: { type: integer }
        matterTitle: { type: string }
        clientName: { type: string }
        feeType: { type: string, enum: [hourly, fixed] }
        currency: { type: string }
        hourlyRateCents: { type: ["integer", "null"] }
        fixedFeeCents: { type: ["integer", "null"] }
        feeDescription: { type: string }
        billingCycle: { type: string, enum: [weekly, monthly, quarterly] }
        taxRateBps: { type: integer }
        scheduleEnabled: { type: boolean }
        periodStartAt: { type: string, format: date-time }
        nextDraftAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BillingProfileInput:
      type: object
      required: [matterId, feeType, currency, feeDescription, billingCycle, taxRateBps, scheduleEnabled, nextDraftAt]
      properties:
        matterId: { type: integer, minimum: 1 }
        feeType: { type: string, enum: [hourly, fixed] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        hourlyRateCents: { type: ["integer", "null"], minimum: 0 }
        fixedFeeCents: { type: ["integer", "null"], minimum: 0 }
        feeDescription: { type: string, minLength: 1, maxLength: 240 }
        billingCycle: { type: string, enum: [weekly, monthly, quarterly] }
        taxRateBps: { type: integer, minimum: 0, maximum: 10000 }
        scheduleEnabled: { type: boolean }
        nextDraftAt: { type: string, format: date-time }
    TimeEntry:
      type: object
      required: [id, matterId, matterTitle, description, workDate, durationMinutes, billable, billingDraftId, createdAt]
      properties:
        id: { type: integer }
        matterId: { type: integer }
        matterTitle: { type: string }
        description: { type: string }
        workDate: { type: string, format: date }
        durationMinutes: { type: integer }
        billable: { type: boolean }
        billingDraftId: { type: ["integer", "null"] }
        createdAt: { type: string, format: date-time }
    TimeEntryInput:
      type: object
      required: [matterId, description, workDate, durationMinutes, billable]
      properties:
        matterId: { type: integer, minimum: 1 }
        description: { type: string, minLength: 1, maxLength: 1000 }
        workDate: { type: string, format: date }
        durationMinutes: { type: integer, minimum: 1, maximum: 1440 }
        billable: { type: boolean }
    BillingDraft:
