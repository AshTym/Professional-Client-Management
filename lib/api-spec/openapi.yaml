openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ClientGuard firm-scoped client and matter management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: workspace
  - name: members
  - name: invitations
  - name: clients
  - name: matters
  - name: dashboard
  - name: activity
  - name: billing
  - name: documents
  - name: planner
  - name: updates
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get the signed-in user's firm and access assurance
      responses:
        "200":
          description: Signed-in user context and current firm workspace membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceContext"
    post:
      operationId: createWorkspace
      tags: [workspace]
      summary: Create a firm and become its owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Firm created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceContext"
  /workspace/invitations:
    get:
      operationId: listWorkspaceInvitations
      tags: [invitations]
      summary: List unused invitations for the current firm, including expired invitations
      responses:
        "200":
          description: Unused firm invitations, including expired invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceInvitation"
        "403":
          description: The current role cannot view invitations
    post:
      operationId: createWorkspaceInvitation
      tags: [invitations]
      summary: Invite a teammate to the current firm by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationInput"
      responses:
        "201":
          description: Invitation email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "400":
          description: Invalid invitation details
        "403":
          description: Only owners and admins can invite teammates
        "409":
          description: The person is already a member or has a pending invitation
        "502":
          description: The invitation email could not be sent
  /workspace/members:
    get:
      operationId: listWorkspaceMembers
      tags: [members]
      summary: List current members of the firm
      responses:
        "200":
          description: Current firm members and their roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
        "403":
          description: Only owners and admins can view firm members
  /workspace/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateWorkspaceMember
      tags: [members]
      summary: Change a firm member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMemberUpdate"
      responses:
        "200":
          description: Member role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          description: Invalid member role
        "403":
          description: Only owners and admins can update members
        "404":
          description: Member not found in this firm or is the firm owner
    delete:
      operationId: removeWorkspaceMember
      tags: [members]
      summary: Reassign client and matter work before removing a firm member
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMemberRemoval"
      responses:
        "204":
          description: Member access removed after assignments were reassigned
        "400":
          description: The selected replacement cannot be the member being removed
        "403":
          description: Only owners and admins can remove members
        "404":
          description: Member or replacement not found in this firm
        "409":
          description: Assigned records need a replacement before access can be removed
  /workspace/members/{id}/assignments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getWorkspaceMemberAssignments
      tags: [members]
      summary: List client and matter records assigned to a firm member
      responses:
        "200":
          description: Assigned clients and matters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberAssignments"
        "403":
          description: Only owners and admins can view member assignments
        "404":
          description: Member not found in this firm
  /workspace/members/{id}/transfer-ownership:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: transferWorkspaceOwnership
      tags: [members]
      summary: Transfer firm ownership to an active member
      responses:
        "200":
          description: Ownership transferred; the previous owner becomes an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          description: The current owner cannot transfer ownership to themself
        "403":
          description: Only the current firm owner can transfer ownership
        "404":
          description: The selected member was not found in this firm
  /workspace/invitations/{id}/resend:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: resendWorkspaceInvitation
      tags: [invitations]
      summary: Send a fresh invitation link to a pending or expired teammate
      responses:
        "200":
          description: A new invitation email was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "403":
          description: Only owners and admins can manage invitations
        "404":
          description: The invitation is not unused in the current firm
        "502":
          description: The invitation email could not be sent
  /workspace/invitations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: withdrawWorkspaceInvitation
      tags: [invitations]
      summary: Withdraw a pending invitation
      responses:
        "204":
          description: Invitation withdrawn
        "403":
          description: Only owners and admins can manage invitations
        "404":
          description: The invitation is not pending in the current firm
  /workspace/invitations/accept:
    post:
      operationId: acceptWorkspaceInvitation
      tags: [invitations]
      summary: Accept a firm invitation as the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationAcceptance"
      responses:
        "200":
          description: Invitation accepted and firm membership established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceContext"
        "400":
          description: Invalid invitation token
        "403":
          description: Signed-in email does not match the invitation
        "404":
          description: Invitation not found
        "409":
          description: User already belongs to another firm
        "410":
          description: Invitation expired or already used
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get firm-scoped dashboard totals and recent activity
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent firm audit events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Recent audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /activity/{id}:
    get:
      operationId: getActivity
      tags: [activity]
      summary: Get a firm audit event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Audit event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Audit event not found in this firm
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: Search and filter firm clients
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [prospect, active, archived]
      responses:
        "200":
          description: Firm clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a firm client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a firm client
      responses:
        "200":
          description: Client record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a firm client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Archive a firm client
      responses:
        "204":
          description: Client archived
  /matters:
    get:
      operationId: listMatters
      tags: [matters]
      summary: Search and filter firm matters
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, on_hold, closed]
      responses:
        "200":
          description: Firm matters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Matter"
    post:
      operationId: createMatter
      tags: [matters]
      summary: Create a firm matter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterInput"
      responses:
        "201":
          description: Matter created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matter"
  /matters/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getMatter
      tags: [matters]
      summary: Get a firm matter
      responses:
        "200":
          description: Matter record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matter"
        "404":
          description: Matter not found
    patch:
      operationId: updateMatter
      tags: [matters]
      summary: Update a firm matter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterUpdate"
      responses:
        "200":
          description: Updated matter record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matter"
    delete:
      operationId: closeMatter
      tags: [matters]
      summary: Close a firm matter
      responses:
        "204":
          description: Matter closed
  /billing:
    get:
      operationId: getBillingOverview
      tags: [billing]
      summary: Get billing profiles, time entries, and draft bills for the firm
      responses:
        "200":
          description: Firm billing overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingOverview"
    put:
      operationId: saveBillingProfile
      tags: [billing]
      summary: Save billing parameters for a matter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingProfileInput"
      responses:
        "200":
          description: Billing profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingProfile"
        "400":
          description: Invalid billing parameters
        "404":
          description: Matter not found
  /billing/time-entries:
    post:
      operationId: createTimeEntry
      tags: [billing]
      summary: Record work performed on a matter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryInput"
      responses:
        "201":
          description: Time entry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Invalid time entry
        "404":
          description: Matter not found
  /billing/drafts/{id}:
    patch:
      operationId: updateBillingDraft
      tags: [billing]
      summary: Mark a draft bill reviewed or return it to draft
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingDraftUpdate"
      responses:
        "200":
          description: Draft bill updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingDraft"
        "404":
          description: Draft bill not found
  /documents:
    get:
      operationId: getDocumentOverview
      tags: [documents]
      summary: List firm documents, pending source suggestions, and confirmed planner items
      responses:
        "200":
          description: Firm document and planner overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOverview"
  /documents/upload-url:
    post:
      operationId: requestDocumentUpload
      tags: [documents]
      summary: Create a private upload reservation for a matter document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUploadInput"
      responses:
        "201":
          description: Upload URL and document record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUpload"
        "400":
          description: Unsupported file or invalid matter
  /documents/{id}/complete:
    post:
      operationId: completeDocumentUpload
      tags: [documents]
      summary: Confirm that the reserved document upload completed
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Document is ready for analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDocument"
        "404":
          description: Upload reservation or object not found
  /documents/{id}/analyze:
    post:
      operationId: analyzeDocument
      tags: [documents]
      summary: Extract source-backed event and task suggestions from a document
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Suggestions with verified source quotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentSuggestion"
        "400":
          description: Document is not ready or has no extractable text
        "404":
          description: Document not found
  /documents/{id}/file:
    get:
      operationId: getMatterDocumentFile
      tags: [documents]
      summary: Stream a private document after firm membership is checked
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Private document bytes
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            text/plain:
              schema: { type: string, format: binary }
        "404":
          description: Document not found
  /documents/{id}:
    delete:
      operationId: deleteMatterDocument
      tags: [documents]
      summary: Delete a firm's uploaded matter document and its suggestions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Document deleted
        "404":
          description: Document not found
  /document-suggestions/{id}:
    patch:
      operationId: reviewDocumentSuggestion
      tags: [documents]
      summary: Confirm a source-backed suggestion into the planner or reject it
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSuggestionUpdate"
      responses:
        "200":
          description: Suggestion reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSuggestion"
        "404":
          description: Suggestion not found
  /planner-items/{id}:
    patch:
      operationId: updatePlannerItem
      tags: [planner]
      summary: Mark a confirmed calendar item or task open or done
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerItemUpdate"
      responses:
        "200":
          description: Planner item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerItem"
        "404":
          description: Planner item not found
  /updates:
    get:
      operationId: getClientUpdateOverview
      tags: [updates]
      summary: List scheduled client update settings and saved drafts
      responses:
        "200":
          description: Firm client update overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUpdateOverview"
  /updates/schedules:
    put:
      operationId: saveClientUpdateSchedule
      tags: [updates]
      summary: Enable or change the scheduled client update draft cadence for a matter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateScheduleInput"
      responses:
        "200":
          description: Client update schedule saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUpdateSchedule"
        "404":
          description: Matter not found
  /updates/drafts:
    post:
      operationId: createClientUpdateDraft
      tags: [updates]
      summary: Draft a client update from recent real matter activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateDraftInput"
      responses:
        "201":
          description: Client update draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUpdateDraft"
        "404":
          description: Matter not found
        "409":
          description: No recent activity is available to support an update
  /updates/drafts/{id}:
    patch:
      operationId: updateClientUpdateDraft
      tags: [updates]
      summary: Edit or mark a client update draft as reviewed
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdateDraftUpdate"
      responses:
        "200":
          description: Client update draft updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientUpdateDraft"
        "404":
          description: Client update draft not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Workspace:
      type: object
      required: [id, name, practiceType, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        practiceType:
          type: string
          enum: [law, financial, both]
        createdAt: { type: string, format: date-time }
    WorkspaceContext:
      type: object
      required: [userId, email, name, workspace, role]
      properties:
        userId: { type: string }
        email: { type: string }
        name: { type: string }
        workspace:
          anyOf:
            - $ref: "#/components/schemas/Workspace"
            - type: "null"
        role:
          type: ["string", "null"]
          enum: [owner, admin, advisor, professional, assistant, null]
    WorkspaceInput:
      type: object
      required: [name, practiceType]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        practiceType:
          type: string
          enum: [law, financial, both]
    WorkspaceInvitation:
      type: object
      required: [id, email, role, createdAt, expiresAt, expired]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role:
          type: string
          enum: [admin, advisor, professional, assistant]
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        expired: { type: boolean }
    WorkspaceMember:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }
    WorkspaceMemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, advisor, professional, assistant]
    WorkspaceMemberRemoval:
      type: object
      properties:
        replacementMemberId: { type: integer, minimum: 1 }
    WorkspaceMemberAssignments:
      type: object
      required: [clients, matters]
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMemberAssignedClient"
        matters:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceMemberAssignedMatter"
    WorkspaceMemberAssignedClient:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
    WorkspaceMemberAssignedMatter:
      type: object
      required: [id, title, reference, clientName]
      properties:
        id: { type: integer }
        title: { type: string }
        reference: { type: string }
        clientName: { type: string }
    WorkspaceInvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role:
          type: string
          enum: [admin, advisor, professional, assistant]
    WorkspaceInvitationAcceptance:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
    Client:
      type: object
      required: [id, name, clientType, email, phone, industry, status, owner, matterCount, lastActivityAt, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        clientType:
          type: string
          enum: [individual, business]
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        status:
          type: string
          enum: [prospect, active, archived]
        owner: { type: string }
        matterCount: { type: integer }
        lastActivityAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    ClientInput:
      type: object
      required: [name, clientType]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        clientType:
          type: string
          enum: [individual, business]
        email: { type: ["string", "null"], format: email }
        phone: { type: ["string", "null"] }
        industry: { type: ["string", "null"] }
        status:
          type: string
          enum: [prospect, active, archived]
    ClientUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        clientType:
          type: string
          enum: [individual, business]
