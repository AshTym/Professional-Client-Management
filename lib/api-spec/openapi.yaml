openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ClientGuard firm-scoped client and matter management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: workspace
  - name: members
  - name: invitations
  - name: clients
  - name: matters
  - name: dashboard
  - name: activity
  - name: billing
  - name: documents
  - name: planner
  - name: updates
  - name: contact
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitContactInquiry
      tags: [contact]
      summary: Deliver a public website inquiry to the ClientGuard contact inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInquiryInput"
      responses:
        "204":
          description: The inquiry was accepted by the email provider
        "400":
          description: The contact form data is invalid
        "429":
          description: Too many contact form submissions
        "502":
          description: Contact email delivery failed
  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: Get the signed-in user's firm and access assurance
      responses:
        "200":
          description: Signed-in user context and current firm workspace membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceContext"
    post:
      operationId: createWorkspace
      tags: [workspace]
      summary: Create a firm and become its owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInput"
      responses:
        "201":
          description: Firm created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceContext"
  /workspace/invitations:
    get:
      operationId: listWorkspaceInvitations
      tags: [invitations]
      summary: List unused invitations and withdrawn invitations needing provider cleanup
      responses:
        "200":
          description: Unused firm invitations, including expired invitations and withdrawn invitations whose provider revocation failed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceInvitation"
        "403":
          description: The current role cannot view invitations
    post:
      operationId: createWorkspaceInvitation
      tags: [invitations]
      summary: Invite a teammate to the current firm by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationInput"
      responses:
        "201":
          description: Invitation email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "400":
          description: Invalid invitation details
        "403":
          description: Only owners and admins can invite teammates
        "409":
          description: The person is already a member or has a pending invitation
        "502":
          description: The invitation email could not be sent
  /workspace/members:
    get:
      operationId: listWorkspaceMembers
      tags: [members]
      summary: List current members of the firm
      responses:
        "200":
          description: Current firm members and their roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMember"
        "403":
          description: Only owners and admins can view firm members
  /workspace/membership-conflicts:
    get:
      operationId: listWorkspaceMembershipConflicts
      tags: [members]
      summary: List duplicate identity memberships visible to current firm administrators
      responses:
        "200":
          description: Conflicts within the current firm only; other firms' identities and names are not returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceMembershipConflict"
        "403":
          description: Only firm owners and admins can view membership conflicts
  /workspace/membership-conflicts/{id}/decision:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: resolveWorkspaceMembershipConflict
      tags: [members]
      summary: Record an explicit access decision for a conflicted membership in the current firm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMembershipConflictDecisionInput"
      responses:
        "200":
          description: The firm-local decision and any explicitly approved access change were recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMembershipConflictDecision"
        "400":
          description: Invalid decision or decision reason
        "403":
          description: Only firm owners and admins can decide membership conflicts
        "404":
          description: Membership is not part of a current conflict in this firm
        "409":
          description: The membership changed, is a protected firm owner, or assigned records need an explicit replacement
  /workspace/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: updateWorkspaceMember
      tags: [members]
      summary: Change a firm member's role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMemberUpdate"
      responses:
        "200":
          description: Member role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          description: Invalid member role
        "403":
          description: Only owners and admins can update members
        "404":
          description: Member not found in this firm or is the firm owner
    delete:
      operationId: removeWorkspaceMember
      tags: [members]
      summary: Reassign client and matter work before removing a firm member
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceMemberRemoval"
      responses:
        "204":
          description: Member access removed after assignments were reassigned
        "400":
          description: The selected replacement cannot be the member being removed
        "403":
          description: Only owners and admins can remove members
        "404":
          description: Member or replacement not found in this firm
        "409":
          description: Assigned records need a replacement before access can be removed
  /workspace/members/{id}/assignments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getWorkspaceMemberAssignments
      tags: [members]
      summary: List client, matter, and pending intake assignments for a firm member
      responses:
        "200":
          description: Assigned clients, matters, and pending intakes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMemberAssignments"
        "403":
          description: Only owners and admins can view member assignments
        "404":
          description: Member not found in this firm
  /workspace/assignment-members:
    get:
      operationId: listWorkspaceAssignmentMembers
      tags: [members]
      summary: List active firm members who can be assigned to client and matter work
      responses:
        "200":
          description: Active member choices in the current firm
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceAssignmentMember"
  /workspace/assignment-issues:
    get:
      operationId: listWorkspaceAssignmentIssues
      tags: [members]
      summary: List legacy client and matter assignments that need an admin to identify a teammate
      responses:
        "200":
          description: Legacy labels that could not be safely linked to one active member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAssignmentIssues"
        "403":
          description: Only owners and admins can review unresolved assignments
  /workspace/assignment-issues/{entityType}/{id}/resolve:
    parameters:
      - name: entityType
        in: path
        required: true
        schema:
          type: string
          enum: [client, matter]
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    patch:
      operationId: resolveWorkspaceAssignmentIssue
      tags: [members]
      summary: Resolve one legacy client or matter assignment by explicitly selecting an active teammate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceAssignmentResolutionInput"
      responses:
        "200":
          description: Assignment linked to the explicitly selected active teammate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAssignmentResolution"
        "400":
          description: The selected teammate is not an active member of this firm
        "403":
          description: Only owners and admins can resolve legacy assignments
        "404":
          description: Unresolved assignment not found in this firm
        "409":
          description: Assignment was already changed
  /workspace/members/{id}/transfer-ownership:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: transferWorkspaceOwnership
      tags: [members]
      summary: Transfer firm ownership to an active member
      responses:
        "200":
          description: Ownership transferred; the previous owner becomes an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceMember"
        "400":
          description: The current owner cannot transfer ownership to themself
        "403":
          description: Only the current firm owner can transfer ownership
        "404":
          description: The selected member was not found in this firm
  /workspace/ownership-notices:
    get:
      operationId: listOwnershipNoticeFailures
      tags: [members]
      summary: List ownership-transfer notices with failed or unconfirmed delivery
      responses:
        "200":
          description: Ownership notices with failed or unconfirmed delivery for the current firm
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnershipNoticeFailure"
        "403":
          description: The user does not belong to a firm
  /workspace/ownership-notices/{transferId}/{recipientRole}/retry:
    parameters:
      - name: transferId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
      - name: recipientRole
        in: path
        required: true
        schema:
          type: string
          enum: [former_owner, new_owner]
    post:
      operationId: retryOwnershipNotice
      tags: [members]
      summary: Retry one failed or unconfirmed ownership-transfer notice without changing firm access
      responses:
        "200":
          description: The notice was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipNoticeRetryResult"
        "400":
          description: Invalid transfer or recipient
        "403":
          description: Only firm owners and admins can retry notices
        "404":
          description: The failed notice was not found in this firm
        "409":
          description: The notice has already been sent or is not awaiting delivery confirmation
        "502":
          description: Clerk could not send the notice; the failed state remains available for another retry
  /workspace/invitations/{id}/resend:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: resendWorkspaceInvitation
      tags: [invitations]
      summary: Send a fresh invitation link to a pending or expired teammate
      responses:
        "200":
          description: A new invitation email was sent; providerRevocationFailed signals incomplete cleanup of the previous provider invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "403":
          description: Only owners and admins can manage invitations
        "404":
          description: The invitation is not unused in the current firm
        "502":
          description: The invitation email could not be sent
  /workspace/invitations/{id}/retry-revocation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      operationId: retryWorkspaceInvitationRevocation
      tags: [invitations]
      summary: Retry unresolved Clerk invitation revocations for a firm invitation
      responses:
        "200":
          description: Revocation attempts completed; providerRevocationFailed indicates whether any cleanup remains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "400":
          description: Invalid invitation identifier
        "403":
          description: Only owners and admins can retry invitation revocations
        "404":
          description: The invitation was not found in the current firm
  /workspace/invitations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      operationId: withdrawWorkspaceInvitation
      tags: [invitations]
      summary: Withdraw a pending invitation
      responses:
        "200":
          description: Invitation withdrawn; providerRevocationFailed signals incomplete cleanup by the identity provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceInvitation"
        "403":
          description: Only owners and admins can manage invitations
        "404":
          description: The invitation is not pending in the current firm
  /workspace/invitations/accept:
    post:
      operationId: acceptWorkspaceInvitation
      tags: [invitations]
      summary: Accept a firm invitation as the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceInvitationAcceptance"
      responses:
        "200":
          description: Invitation accepted and firm membership established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceContext"
        "400":
          description: Invalid invitation token
        "403":
          description: Signed-in email does not match the invitation
        "404":
          description: Invitation not found
        "409":
          description: User already belongs to another firm
        "410":
          description: Invitation expired or already used
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get firm-scoped dashboard totals and recent activity
      responses:
        "200":
          description: Dashboard snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity/actors:
    get:
      operationId: listActivityActors
      tags: [activity]
      summary: List actors represented in the current firm's activity history
      responses:
        "200":
          description: Distinct actors from this firm's activity history with firm-scoped opaque identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityActorsResponse"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List recent firm audit events
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: snapshotId
          in: query
          required: false
          description: Include only events at or below this firm-wide activity snapshot ID.
          schema:
            type: integer
            minimum: 0
        - name: search
          in: query
          required: false
          description: Case-insensitive text contained in the event action or record label.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: actorId
          in: query
          required: false
          description: Restrict results to this actor from the current firm's actor list.
          schema:
            type: string
            minLength: 67
            maxLength: 67
            pattern: "^v1_[a-f0-9]{64}$"
        - name: entityType
          in: query
          required: false
          description: Restrict results to a related client, matter, or workspace record.
          schema:
            type: string
            enum: [client, matter, workspace]
        - name: entityId
          in: query
          required: false
          description: ID of the related record to include.
          schema:
            type: integer
            minimum: 1
        - name: startDate
          in: query
          required: false
          description: Include events occurring on or after this UTC calendar date.
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: Include events occurring on or before this UTC calendar date.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Audit events from a stable firm-wide snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
  /activity/export.csv:
    get:
      operationId: exportActivity
      tags: [activity]
      summary: Export the current firm's activity history
      parameters:
        - name: snapshotId
          in: query
          required: false
          description: Include only events at or below this firm-wide activity snapshot ID.
          schema:
            type: integer
            minimum: 0
        - name: search
          in: query
          required: false
          description: Case-insensitive text contained in the event action or record label.
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: actorId
          in: query
          required: false
          description: Restrict results to this actor from the current firm's actor list.
          schema:
            type: string
            minLength: 67
            maxLength: 67
            pattern: "^v1_[a-f0-9]{64}$"
        - name: entityType
          in: query
          required: false
          description: Restrict results to a related client, matter, or workspace record.
          schema:
            type: string
            enum: [client, matter, workspace]
        - name: entityId
          in: query
          required: false
          description: ID of the related record to include.
          schema:
            type: integer
            minimum: 1
        - name: startDate
          in: query
          required: false
          description: Include events occurring on or after this UTC calendar date.
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: false
          description: Include events occurring on or before this UTC calendar date.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Firm activity history in CSV format, newest events first
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid export filters
  /activity/{id}:
    get:
      operationId: getActivity
      tags: [activity]
      summary: Get a firm audit event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Audit event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Audit event not found in this firm
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: Search and filter firm clients
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [prospect, active, archived]
      responses:
        "200":
          description: Firm clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a firm client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /clients/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a firm client
      responses:
        "200":
          description: Client record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Client not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a firm client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Archive a firm client
      responses:
        "204":
          description: Client archived
  /matters:
    get:
      operationId: listMatters
      tags: [matters]
      summary: Search and filter firm matters
      parameters:
        - name: clientId
          in: query
          required: false
          description: Return only matters currently assigned to this client.
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, on_hold, closed]
      responses:
        "200":
          description: Firm matters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Matter"
    post:
      operationId: createMatter
      tags: [matters]
      summary: Create a firm matter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterInput"
      responses:
        "201":
          description: Matter created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matter"
  /matters/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getMatter
      tags: [matters]
      summary: Get a firm matter
      responses:
        "200":
          description: Matter record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matter"
        "404":
          description: Matter not found
    patch:
      operationId: updateMatter
      tags: [matters]
      summary: Update a firm matter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatterUpdate"
      responses:
        "200":
          description: Updated matter record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matter"
    delete:
      operationId: closeMatter
      tags: [matters]
      summary: Close a firm matter
      responses:
        "204":
          description: Matter closed
  /billing:
    get:
      operationId: getBillingOverview
      tags: [billing]
      summary: Get billing profiles, time entries, and draft bills for the firm
      responses:
        "200":
          description: Firm billing overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingOverview"
    put:
      operationId: saveBillingProfile
      tags: [billing]
      summary: Save billing parameters for a matter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingProfileInput"
      responses:
        "200":
          description: Billing profile saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingProfile"
        "400":
          description: Invalid billing parameters
        "404":
          description: Matter not found
  /billing/time-entries:
    post:
      operationId: createTimeEntry
      tags: [billing]
      summary: Record work performed on a matter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryInput"
      responses:
        "201":
          description: Time entry recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          description: Invalid time entry
        "404":
          description: Matter not found
  /billing/drafts/{id}:
    patch:
      operationId: updateBillingDraft
      tags: [billing]
      summary: Mark a draft bill reviewed or return it to draft
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingDraftUpdate"
      responses:
        "200":
          description: Draft bill updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingDraft"
        "404":
          description: Draft bill not found
  /documents:
    get:
      operationId: getDocumentOverview
      tags: [documents]
      summary: List firm documents, pending source suggestions, and confirmed planner items
      responses:
        "200":
          description: Firm document and planner overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentOverview"
  /documents/upload-url:
    post:
      operationId: requestDocumentUpload
      tags: [documents]
      summary: Create a private upload reservation for a matter document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUploadInput"
      responses:
        "201":
          description: Upload URL and document record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentUpload"
        "400":
          description: Unsupported file or invalid matter
  /documents/{id}/complete:
    post:
      operationId: completeDocumentUpload
      tags: [documents]
