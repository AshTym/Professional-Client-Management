      required: [id, accountId, sourceType, sourceName, periodStart, periodEnd, openingBalanceCents, closingBalanceCents, status, lineCount, matchedLines, unmatchedLineCount, movementDifferenceCents, createdAt]
      properties:
        id: { type: integer }
        accountId: { type: integer }
        sourceType: { type: string, enum: [manual, csv] }
        sourceName: { type: string }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        openingBalanceCents: { type: integer }
        closingBalanceCents: { type: integer }
        status: { type: string, enum: [open, reconciled] }
        lineCount: { type: integer }
        matchedLines: { type: integer }
        unmatchedLineCount: { type: integer }
        movementDifferenceCents: { type: integer }
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/TrustStatementLine" }
    TrustOverview:
      type: object
      required: [supportedJurisdictions, accounts, entries, statements, alerts]
      properties:
        supportedJurisdictions:
          type: array
          items: { type: string, enum: [Australia, USA, Great Britain] }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/TrustAccount" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/TrustEntry" }
        statements:
          type: array
          items: { $ref: "#/components/schemas/TrustStatement" }
        alerts:
          type: array
          items:
            type: object
            required: [id, severity, title, detail, accountId, statementId]
            properties:
              id: { type: string }
              severity: { type: string, enum: [attention, warning] }
              title: { type: string }
              detail: { type: string }
              accountId: { type: integer }
              statementId: { type: ["integer", "null"] }
    TrustAccountStatement:
      type: object
      required: [accountId, accountName, jurisdiction, currency, matterId, matterTitle, clientName, from, to, openingBalanceCents, closingBalanceCents, entries]
      properties:
        accountId: { type: integer }
        accountName: { type: string }
        jurisdiction: { type: string, enum: [Australia, USA, Great Britain] }
        currency: { type: string }
        matterId: { type: integer }
        matterTitle: { type: string }
        clientName: { type: string }
        from: { type: string, format: date }
        to: { type: string, format: date }
        openingBalanceCents: { type: integer }
        closingBalanceCents: { type: integer }
        entries:
          type: array
          items:
            type: object
            required: [id, entryDate, description, reference, entryType, amountCents, balanceCents]
            properties:
              id: { type: integer }
              entryDate: { type: string, format: date }
              description: { type: string }
              reference: { type: ["string", "null"] }
              entryType: { type: string, enum: [deposit, disbursement] }
              amountCents: { type: integer }
              balanceCents: { type: integer }
    CloseoutItem:
      type: object
      required: [id, itemKey, title, status, completedBy, completedAt]
      properties:
        id: { type: integer }
        itemKey: { type: string, enum: [final_billing, document_handover, retention_review] }
        title: { type: string }
        status: { type: string, enum: [open, complete] }
        completedBy: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"], format: date-time }
    MatterFollowupInput:
      type: object
      required: [dueAt, reason]
      properties:
        dueAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    MatterFollowupUpdateInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, complete] }
    MatterFollowup:
      type: object
      required: [id, matterId, matterTitle, clientName, dueAt, reason, status, createdAt]
      properties:
        id: { type: integer }
        matterId: { type: integer }
        matterTitle: { type: string }
        clientName: { type: string }
        dueAt: { type: string, format: date-time }
        reason: { type: string }
        status: { type: string, enum: [open, complete] }
        createdAt: { type: string, format: date-time }
    MatterCloseout:
      type: object
      required: [matterId, matterTitle, matterStatus, items, followups, retentionDays, targetRetentionDate, legalHold, canClose]
      properties:
        matterId: { type: integer }
        matterTitle: { type: string }
        matterStatus: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CloseoutItem" }
        followups:
          type: array
          items: { $ref: "#/components/schemas/MatterFollowup" }
        retentionDays: { type: integer }
        targetRetentionDate: { type: ["string", "null"], format: date }
        legalHold: { type: boolean }
        canClose: { type: boolean }
    CloseoutItemUpdateInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, complete] }
    OperationsReport:
      type: object
      required: [from, to, totals, pipeline, agingWorkInProgress, workload, upcomingDeadlines, followups]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals:
          type: object
          required: [openMatters, onHoldMatters, overdueDeadlines, dueNext7Days]
          properties:
            openMatters: { type: integer }
            onHoldMatters: { type: integer }
            overdueDeadlines: { type: integer }
            dueNext7Days: { type: integer }
        pipeline:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: integer }
        agingWorkInProgress:
          type: array
          items:
            type: object
            required: [bucket, currency, entryCount, hours, estimatedCents, pricedEntryCount, fixedFeeEntryCount, unpricedEntryCount]
            properties:
              bucket: { type: string }
              currency: { type: ["string", "null"] }
              entryCount: { type: integer }
              hours: { type: number }
              estimatedCents: { type: integer }
              pricedEntryCount: { type: integer }
              fixedFeeEntryCount: { type: integer }
              unpricedEntryCount: { type: integer }
        workload:
          type: array
          items:
            $ref: "#/components/schemas/TeamCapacity"
        upcomingDeadlines:
          type: array
          items:
            type: object
            required: [matterId, matterTitle, clientName, responsible, dueAt, riskLevel]
            properties:
              matterId: { type: integer }
              matterTitle: { type: string }
              clientName: { type: string }
              responsible: { type: string }
              dueAt: { type: string, format: date-time }
              riskLevel: { type: string }
        followups:
          type: array
          items: { $ref: "#/components/schemas/MatterFollowup" }
    OperationsReportExportInput:
      type: object
      required: [format, from, to]
      properties:
        format: { type: string, enum: [csv, pdf] }
        from: { type: string, format: date }
        to: { type: string, format: date }
    OperationsReportExportResult:
      type: object
      required: [logged]
      properties:
        logged: { type: boolean }
    TeamCapacity:
      type: object
      required: [membershipId, name, role, weeklyCapacityMinutes, activeMatterLimit, activeMatterCount, loggedMinutes]
      properties:
        membershipId: { type: integer }
        name: { type: string }
        role: { type: string }
        weeklyCapacityMinutes: { type: integer }
        activeMatterLimit: { type: integer }
        activeMatterCount: { type: integer }
        loggedMinutes: { type: integer }
    TeamCapacityInput:
      type: object
      required: [capacities]
      properties:
        capacities:
          type: array
          maxItems: 250
          items:
            type: object
            required: [membershipId, weeklyCapacityMinutes, activeMatterLimit]
            properties:
              membershipId: { type: integer, minimum: 1 }
              weeklyCapacityMinutes: { type: integer, minimum: 60, maximum: 10080 }
              activeMatterLimit: { type: integer, minimum: 1, maximum: 1000 }
    AuthorizationUrl:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl: { type: string, format: uri }
    ProviderSyncResult:
      type: object
      required: [provider, externalId, message]
      properties:
        provider: { type: string }
        externalId: { type: string }
        message: { type: string }
    SendReviewedUpdateEmailInput:
      type: object
      required: [draftId]
      properties:
        draftId: { type: integer, minimum: 1 }
